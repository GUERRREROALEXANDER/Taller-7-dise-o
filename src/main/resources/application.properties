spring.application.name=smartlibrary

# Puerto 8081: en este equipo el 8080 lo ocupa otro servicio (AgentService)
server.port=8081

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:smartlibrary
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Fechas en JSON como yyyy-MM-dd (no timestamps)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
